# Dokploy-ready compose file.
#
# Port 443 is shared with Dokploy's Traefik. No host port is published.
#
# Fake-TLS clients send the fake domain (TELEMT_CENSORSHIP__TLS_DOMAIN) as
# the TLS SNI. A Traefik TCP router matches that SNI and passes the raw
# connection through to telemt without terminating TLS. Every other SNI keeps
# going to the HTTP services on the same port, so nothing else changes.
#
#   client --443--> Traefik --SNI = TLS_DOMAIN, passthrough--> telemt:443
#                           \--any other SNI------------------> web apps
#
# Traefik prepends a PROXY protocol v2 header so telemt sees the client
# address instead of Traefik's. Both ends are set below and must stay in sync:
# the label adds the header, TELEMT_SERVER__PROXY_PROTOCOL=true parses it.
#
# Required Dokploy env: TELEMT_GENERAL__LINKS__PUBLIC_PORT=443 so share links
# point at 443. TLS_DOMAIN must never be a domain served by this Traefik,
# or that site's traffic would be sent to telemt.
#
# Metrics and API endpoints remain internal (expose only, no public ports).
#
# All env vars are documented in .env.example. Set them in the Dokploy UI
# environment section, not in this file.

services:
  telemt:
    image: ghcr.io/telemt/telemt:latest
    build:
      context: .
      target: prod
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.tcp.routers.telemt.entrypoints=websecure
      - traefik.tcp.routers.telemt.rule=HostSNI(`${TELEMT_CENSORSHIP__TLS_DOMAIN:-petrovich.ru}`)
      - traefik.tcp.routers.telemt.tls.passthrough=true
      - traefik.tcp.routers.telemt.service=telemt
      - traefik.tcp.services.telemt.loadbalancer.server.port=443
      # Traefik v2 syntax. On Traefik v3 this moves to a serversTransport.
      - traefik.tcp.services.telemt.loadbalancer.proxyprotocol.version=2
    expose:
      - "443"
      - "9090"
      - "9091"
    working_dir: /run/telemt
    command: ["/app/config.toml"]
    # volumes:
    #   - ./config:/etc/telemt:rw
    tmpfs:
      - /run/telemt:rw,mode=1777,size=4m
    # env_file passes all vars from Dokploy's .env (TELEMT_*, RUST_LOG, etc.)
    # to the container. environment below provides defaults for RUST_LOG.
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      # Pairs with the proxyprotocol label above; one without the other breaks every connection.
      - TELEMT_SERVER__PROXY_PROTOCOL=true
    healthcheck:
      test: [ "CMD", "/app/telemt", "healthcheck", "/app/config.toml", "--mode", "liveness" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
